spring:
  application:
    name: aetheros-control
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
aetheros:
  proxy:
    bind-host: 127.0.0.1
    bind-port: 1080
  sentinel:
    providers: [google, cloudflare, quad9, opendns, adguard]
